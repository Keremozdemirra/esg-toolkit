[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "target-path"
version = "0.1.0"
description = "Build absolute-contraction and intensity-convergence emission target pathways and measure actual performance against them."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["sbti", "science-based-targets", "emissions", "climate", "esg"]
dependencies = []

[project.scripts]
target-path = "target_path.cli:main"

[tool.setuptools.packages.find]
include = ["target_path*"]
